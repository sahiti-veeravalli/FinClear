spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finclear?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: finclear
    password: finclear
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: finclear
      auto-offset-reset: earliest
    producer:
      acks: all
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
finclear:
  jwt:
    secret: "change-this-development-secret-to-a-long-random-value-at-least-32-bytes"
    expiry-minutes: 120
